<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div>
<form method="get">

<h2> <u>Student Registration</u> </h2>
<p class="center">Please fill in your details carefully.</p>

<p>Personal details :-</p>

<label for="name">Full Name <span>*</span></label><br>
<input class="box" type="text" id="name" placeholder="Enter your full name" required><br><br>

<label for="email">Email <span>*</span></label><br>
<input class="box" type="email" id="email" placeholder="name123@gmail.com" required><br><br>

<label for="password">Password <span>*</span></label><br>
<input class="box" type="password" id="password" placeholder="name@123" required><br><br>

<label for="tel">Phone Number <span>*</span></label><br>
<input class="box" type="tel" id="tel" placeholder="9278145630" required><br><br>

<label for="url">Profile URL</label><br>
<input class="box" type="url" id="url" placeholder="https://example.com"><br><br>

<label for="age">Age <span>*</span></label><br>
<input class="box" type="number" id="age" placeholder="18" required><br><br>

<label>Gender :-</label>
<input type="radio" name="gender" id="male">
<label for="male">Male</label>

<input type="radio" name="gender" id="female">
<label for="female">Female</label>

<input type="radio" name="gender" id="other">
<label for="other">Other</label>

<p>Education :-</p>

<label for="course">Course <span>*</span></label><br>
<select name="education" id="course" class="box" required>
<option value="B Tech">B Tech</option>
<option value="BCA">BCA</option>
<option value="BSc">BSc</option>
<option value="BCA AI">BCA AI</option>
</select><br><br>

<label for="city">City</label><br>
<input type="text" id="city" placeholder="Noida" class="box"><br><br>

<label>Skills :-</label>
<input type="checkbox" id="html">
<label for="html">HTML5</label>

<input type="checkbox" id="css">
<label for="css">CSS</label>

<input type="checkbox" id="java">
<label for="java">Java</label>

<input type="checkbox" id="js">
<label for="js">JavaScript</label>

<br><br>
<p>Some details</p>

<label for="date">Form Submit Date <span>*</span></label><br>
<input type="date" id="date" class="box" required><br><br>

<label for="time">Form Submit Time</label><br>
<input type="time" id="time" class="box"><br><br>

<label for="file">Resume File <span>*</span></label><br>
<input type="file" id="file" required><br><br>

<label for="money">Money</label>
<input type="range" id="money" min="1000" max="100000"><br><br>

<label for="color">Choose Colour</label>
<input type="color" id="color"><br><br>

<label for="about">About Yourself</label><br>
<textarea id="about" rows="8" cols="40" maxlength="150" placeholder="Tell us about yourself in 150 words"></textarea>

<br><br>
<button type="submit">Submit</button>

</form>
</div>
</body>
</html>
